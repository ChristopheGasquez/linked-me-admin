server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed build output (main-XXXXXXXX.js, styles-XXXXXXXX.css, chunk-XXXXXXXX.js): content never changes for a given name
  location ~ ^/(main|chunk|styles|polyfills)-[A-Za-z0-9_-]{8}\.(js|css)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Unversioned files (index.html, i18n/*.json, config.json, icons): always revalidate with the server
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
