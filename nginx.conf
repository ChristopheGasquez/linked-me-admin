server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed build output (main-XXXXXXXX.js, styles-XXXXXXXX.css, chunk-XXXXXXXX.js): content never changes for a given name
  location ~ "^/(main|chunk|styles|polyfills)-[A-Za-z0-9_-]{8}\.(js|css)$" {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Unversioned files (index.html, i18n/*.json, config.json, icons): always revalidate with the server
  location / {
    add_header Cache-Control "no-cache";
    # Report-Only first: violations show in the browser console without blocking anything
    # __API_URL__ is replaced at container startup (docker-entrypoint.sh)
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' __API_URL__; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    try_files $uri $uri/ /index.html;
  }
}
