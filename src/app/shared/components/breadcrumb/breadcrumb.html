<nav
  *transloco="let t"
  class="breadcrumb"
  [attr.aria-label]="t('common.breadcrumb')">
  <ol class="breadcrumb__list">
    @for (item of parents; track item.url) {
      <li><a [routerLink]="item.link">{{ t(item.labelKey) }}</a></li>
    }
    @let current = label() ?? (currentKey ? t(currentKey) : null);
    @if (current) {
      <li aria-current="page">{{ current }}</li>
    }
  </ol>
</nav>
