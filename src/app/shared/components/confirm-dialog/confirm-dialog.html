<ng-container *transloco="let t">
  <h2 mat-dialog-title>{{ t(data.titleKey) }}</h2>
  <mat-dialog-content>{{ t(data.messageKey, data.messageParams ?? {}) }}</mat-dialog-content>
  <mat-dialog-actions align="end">
    <button
      matButton
      type="button"
      [mat-dialog-close]="false">
      {{ t('common.cancel') }}
    </button>
    <button
      matButton="filled"
      type="button"
      [class.button--error]="data.destructive"
      [mat-dialog-close]="true"
      cdkFocusInitial>
      {{ t(data.confirmLabelKey ?? 'common.confirm') }}
    </button>
  </mat-dialog-actions>
</ng-container>
